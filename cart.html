<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cart | Kids & Co</title>
  <link rel="icon" href="assets/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div id="navbar"></div>

  <main>
    <section class="cart-hero">
      <div class="container cart-hero-box">
        <span class="section-tag">Your Cart</span>
        <h1>Review Your Selected Items</h1>
        <p>Add your favourite products, then send the full inquiry to us on WhatsApp.</p>
      </div>
    </section>

    <section class="cart-section">
      <div class="container cart-layout">

        <div class="cart-items-card">
          <div class="cart-header">
            <h2>Selected Products</h2>
            <button class="clear-cart-btn" onclick="clearCart()">Clear Cart</button>
          </div>

          <div id="cart-items" class="cart-items"></div>
        </div>

        <div class="cart-summary-card">
          <h2>Inquiry Summary</h2>

          <div class="summary-row">
            <span>Total Items</span>
            <strong id="cart-count">0</strong>
          </div>

          <div class="summary-row">
            <span>Estimated Total</span>
            <strong id="cart-total">LKR 0</strong>
          </div>

          <p class="summary-note">
            Final price, availability, and delivery details will be confirmed through WhatsApp.
          </p>

          <button class="btn whatsapp full-btn" onclick="sendCartInquiry()">
            Inquire on WhatsApp
          </button>

          <a href="shop.html" class="btn secondary full-btn">
            Continue Shopping
          </a>
        </div>

      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/app.js"></script>
  <script src="js/cart.js?v=3"></script>
</body>
</html>
